<head>

<style>
  /* Colors estimated from the website screenshot. Swap hex values here if needed. */
  :root {
    --bg-deep: #0b1426;
    --bg-teal: #0f4658;
    --teal: #14b8a6;
    --lime: #a3e635;
    --cyan: #06b6d4;
    --lime-dark: #8fd01f;
    --text: #e6edf5;
    --muted: #8a9bb3;
    --line: rgba(20, 184, 166, 0.45);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg-deep); }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(ellipse at 0% 0%, var(--bg-teal) 0%, rgba(15, 70, 88, 0) 60%),
      radial-gradient(ellipse at 100% 100%, #134452 0%, rgba(19, 68, 82, 0) 55%),
      var(--bg-deep);
    background-attachment: fixed;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 {
    margin: 0 0 6px;
    font-size: 30px;
    font-weight: 800;
    line-height: 1.15;
    color: var(--teal);
  }
  .title {
    margin: 0 0 22px;
    color: var(--lime);
    font-size: 16px;
    font-weight: 600;
  }
  .line {
    margin: 0 auto 28px;
    max-width: 380px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.55;
  }
  a.btn {
    display: block;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
    text-align: center;
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
  }
  a.btn:active { transform: scale(0.98); }
  a.primary {
    background: linear-gradient(90deg, var(--teal), var(--lime));
    color: #0b1426;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 600;
    border: 1.5px solid transparent;
    margin-bottom: 10px;
  }
  a.primary:hover { filter: brightness(1.08); }
  .secondary-group { display: grid; gap: 10px; }
  a.secondary {
    background: rgba(11, 20, 38, 0.45);
    color: var(--text);
    border: 1.5px solid var(--line);
    padding: 14px 16px;
    font-size: 16px;
  }
  .secondary-group .secondary:nth-child(1) { color: #9ee633; border-color: #9ee6338c; }
  .secondary-group .secondary:nth-child(1):hover { border-color: #9ee633; }
  .secondary-group .secondary:nth-child(2) { color: #42c77f; border-color: #42c77f8c; }
  .secondary-group .secondary:nth-child(2):hover { border-color: #42c77f; }
  .secondary-group .secondary:nth-child(3) { color: #10b7b5; border-color: #10b7b58c; }
  .secondary-group .secondary:nth-child(3):hover { border-color: #10b7b5; }
  .secondary-group .secondary:nth-child(4) { color: #07b6d5; border-color: #07b6d58c; }
  .secondary-group .secondary:nth-child(4):hover { border-color: #07b6d5; }
  .foot { margin: 28px 0 0; font-size: 17px; color: var(--muted); }
</style>
</head>
<body>
  <main>

    <a class="btn primary" href="https://www.linkedin.com/in/jordynseri">Connect on LinkedIn</a>

    <div class="secondary-group">
      <a class="btn secondary" href="https://koalendar.com/e/meet-with-jordyn-apha">Book time to chat during APHA</a>
      <a class="btn secondary" href="https://koalendar.com/e/chat-with-jordyn">Book time to chat after the conference</a>

      <a class="btn secondary" href="mailto:hello@jordynseri.com">Email me at hello@jordynseri.com</a>
    </div>

    <p class="foot">Great meeting you!</p>
  </main>
</body>
